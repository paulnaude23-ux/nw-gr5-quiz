const best=()=>ld('nwBest',{}),stars=()=>ld('nwStars',{}),foute=()=>ld('nwFoute',[]);
function addFout(i){const f=foute();if(!f.includes(i)){f.push(i);sv('nwFoute',f)}}
function delFout(i){sv('nwFoute',foute().filter(x=>x!==i))}
(()=>{if(!localStorage.getItem('nwV5')){const st=ld('nwStars',{});if(st[7]!=null){st[LV.length-1]=st[7];delete st[7];sv('nwStars',st)}localStorage.setItem('nwV5','1')}})();
const unlocked=i=>i==0||(stars()[i-1]||0)>=1||(stars()[i]||0)>=1;
function wurm(m){const mouth=m=='happy'?'<path d="M84,44 q8,9 16,0" stroke="#5b3a8c" stroke-width="3" fill="none"/>':m=='sad'?'<path d="M84,50 q8,-8 16,0" stroke="#5b3a8c" stroke-width="3" fill="none"/><ellipse cx="80" cy="44" rx="2.5" ry="4" fill="#7fd8f0"/>':'<path d="M85,46 h14" stroke="#5b3a8c" stroke-width="3"/>';
return `<svg class="wm ${m}" viewBox="0 0 120 70" width="84" height="49"><g class="bd"><g fill="#ff8fc8" stroke="#e86aa8" stroke-width="2"><circle cx="18" cy="56" r="11"/><circle cx="36" cy="52" r="12"/><circle cx="55" cy="46" r="13"/><circle cx="74" cy="40" r="14"/></g><circle cx="92" cy="36" r="20" fill="#ff9fd0" stroke="#e86aa8" stroke-width="2"/><circle class="eye" cx="86" cy="31" r="4" fill="#2a1b4d"/><circle class="eye" cx="99" cy="31" r="4" fill="#2a1b4d"/><circle cx="87" cy="30" r="1.3" fill="#fff"/><circle cx="100" cy="30" r="1.3" fill="#fff"/><circle cx="81" cy="40" r="3" fill="#ffc2e0"/><circle cx="104" cy="40" r="3" fill="#ffc2e0"/>${mouth}<path d="M92,16 q4,-10 10,-8" stroke="#43c6c0" stroke-width="3" fill="none"/></g></svg>`}
function masc(m,t){return `<div class="masc" id="masc">${wurm(m)}<div class="bub" id="bub">${t}</div></div>`}
function mood(m,t){const e=document.getElementById('masc');if(e)e.outerHTML=masc(m,t)}
function curve(p){p=p.map(s=>s.split(',').map(Number));let d=`M${p[0]}`;for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],m=(a[1]+b[1])/2;d+=` C${a[0]},${m} ${b[0]},${m} ${b[0]},${b[1]}`}return d}
const vib=m=>{try{navigator.vibrate&&navigator.vibrate(m)}catch(e){}};
function home(){stopCf();const b=best(),st=stars(),f=foute().length,offs=[0,70,95,70,0,-70,-95,-70],H=118,W=320;
let pts=[],nodes='',cur0=false;LV.forEach((l,i)=>{const x=W/2+offs[i%8],y=50+i*H;pts.push(x+','+y);const u=unlocked(i),s=st[i]||0,cur=u&&!s&&!cur0;if(cur)cur0=true;const lr=offs[i%8]>0;
nodes+=`<div class="nd ${u?'':'lk'} ${cur?'cur':''} ${s?'done':''} ${l.test&&!s?'gt':''}" style="left:${x}px;top:${y}px" data-lv="${i}" onclick="${u?`startLevel(${i})`:`mood('sad','Eers die vorige vlak! 🔒')`}"><span>${u?l.ic:'🔒'}</span></div>
<div class="nl ${lr?'r':''}" style="${lr?`left:${x-48-112}px`:`left:${x+48}px`};top:${y}px"><div class="st">${[1,2,3].map(k=>`<span>${k<=s?'⭐':'☆'}</span>`).join('')}</div>${l.n}</div>`});
app.innerHTML=`<div class="card">${masc('happy',f?`Hallo! Kom ons leer! Jy het ${f} foute om te oefen 💪`:'Hallo! Ek is Wurmpie. Kom ons leer saam! 🌱')}</div>
<div class="path" style="height:${LV.length*H+30}px"><svg width="${W}" height="${LV.length*H+30}" style="position:absolute;left:0;top:0"><path d="${curve(pts)}" fill="none" stroke="#ffffff22" stroke-width="16" stroke-linecap="round"/><path d="${curve(pts)}" fill="none" stroke="#ffd6f0" stroke-width="5" stroke-dasharray="1 13" stroke-linecap="round"/></svg>${nodes}</div>
<div class="card center"><button class="big" id="fbtn" ${f?'':'disabled style="opacity:.5"'} onclick="startFoute()">🧐 My foute (${f})</button>
<p><b>Vrye oefening</b></p><button class="teal" onclick="startFree('A','o')">🌍 Die Aarde beweeg: Oefenmodus</button><button class="teal" onclick="startFree('G','o')">🌱 Die oppervlak van die Aarde: Oefenmodus</button><button class="teal" onclick="startFree('S','o')">🧱 Sedimentgesteentes: Oefenmodus</button><button class="teal" onclick="startFree('F','o')">🦴 Fossiele: Oefenmodus</button><button class="teal" onclick="startFree('X','t')">📝 Toetsmodus: alles gemeng</button>
<p>🏆 Beste tellings: Aarde ${b.A??'-'}% · Grond ${b.G??'-'}% · Gesteentes ${b.S??'-'}% · Fossiele ${b.F??'-'}% · Toets ${b.X??'-'}%</p><button class="lnk" onclick="reset()">↺ Herstel vordering</button></div>`}
function reset(){if(confirm('Is jy seker? Al jou sterre, foute en beste tellings word uitgevee.')){['nwBest','nwStars','nwFoute','nwV5'].forEach(k=>localStorage.removeItem(k));home()}}
function begin(o){stopCf();S=Object.assign({i:0,sc:0,st:0,max:0,tried:false},o);show()}
const qi=a=>shuf(a).map(i=>({k:'q',i}));
function startLevel(li){const l=LV[li];if(!unlocked(li))return;begin(l.test?{mode:'lvl',lv:li,t:'X',m:'t',items:qi(Q.map((_,i)=>i))}:{mode:'lvl',lv:li,t:l.t,m:'o',items:qi(l.q).concat((l.d||[]).map(d=>({k:'d',d})))})}
function startFree(t,m){begin({mode:'free',t,m,items:qi(Q.map((_,i)=>i).filter(i=>t=='X'||Q[i][4]==t))})}
function startFoute(){const f=foute();if(!f.length)return;begin({mode:'foute',t:'X',m:'o',items:qi(f)})}
function hdr(){const n=S.items.length;return `<div class="top"><button class="x" onclick="home()">✕</button><span>${S.mode=='lvl'?LV[S.lv].n:S.mode=='foute'?'My foute':'Vrye oefening'} · ${S.i+1}/${n}</span><span><span class="fl">🔥</span> ${S.st} · ⭐ <span id="scv">${S.sc}</span></span></div><div class="bar"><div class="fill" style="width:${Math.max(0,S.i-1)/n*100}%" data-w="${S.i/n*100}"></div></div>`}
function show(){S.tried=false;SEL=null;const it=S.items[S.i];if(it.k=='d')return showDrag(it.d);const q=Q[it.i];
const o=q[1].map((x,k)=>[x,k==q[2]]);S.cur=q[1].length==2?o:shuf(o);
app.innerHTML=hdr()+`<div class="card">${masc('neutral',S.m=='t'?'Jy kan dit doen! ✨':'Dink mooi... 🤔')}<span class="tag">${TAG[q[4]]}</span>
${q[5]?`<div class="pic">${q[5]}</div>`:''}<div class="q">${q[0]}</div>${S.cur.map((o,k)=>`<button class="op" id="b${k}" onclick="ans(${k})">${o[0]}</button>`).join('')}<div class="fb" id="fb"></div><div id="nx"></div></div>`}
function hit(){S.sc++;S.st++;S.max=Math.max(S.max,S.st);vib(25);const e=document.getElementById('scv');if(e){e.textContent=S.sc;e.classList.remove('tick');void e.offsetWidth;e.classList.add('tick')}}
function ans(k){const it=S.items[S.i],q=Q[it.i],b=document.getElementById('b'+k),fb=document.getElementById('fb');if(b.disabled)return;const right=S.cur[k][1];
if(!right&&!S.tried)addFout(it.i);
if(S.m=='o'){if(right){b.classList.add('ok');if(!S.tried){hit();if(S.mode=='foute')delFout(it.i)}const g=pick(GOOD);mood('happy',g);fb.innerHTML=g+(S.st>=3?` 🔥 ${S.st} op 'n ry!`:'')+`<div class="ex">${q[3]}</div>`;lock();next()}
else{b.classList.add('bad');b.disabled=true;vib([40,40,40]);S.tried=true;S.st=0;const m=pick(BAD);mood('sad',m);fb.textContent=m}}
else{if(right)hit();else S.st=0;adv()}}
function lock(){document.querySelectorAll('.card button.op').forEach(x=>x.disabled=true)}
function adv(){S.i++;S.i<S.items.length?show():end()}
function next(){document.getElementById('nx').innerHTML=`<button class="big" id="nxb" onclick="adv()">Volgende ➜</button>`}
function showDrag(d){const D=DR[d],ch=D.ch||D.lab.map(l=>[l[0],l[0]]);
app.innerHTML=hdr()+`<div class="card">${masc('neutral',D.msg||'Sleep elke naam na die regte plek, of tik die naam en dan die plek! 👆')}<span class="tag">✋ ${D.bin?'Sorteer':D.w?'Sleep en pas':'Sleep en benoem'}</span>
<div class="dz"><div class="pic">${SV[D.s]}</div>${D.lab.map(l=>`<div class="tg ${D.w?'w':''} ${D.bin?'bin':''}" data-l="${l[0]}" data-n="${ch.filter(c=>c[1]==l[0]).length}" data-c="0" style="left:${l[1]}%;top:${l[2]}%">${D.bin?'<div class="bi"></div>':l[3]?`<b>${l[3]}</b>`:'?'}</div>`).join('')}</div>
<div class="chips">${shuf(ch).map(c=>`<div class="chip" data-l="${c[1]}">${c[0]}</div>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div></div>`;
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('pointerdown',chipDown));
document.querySelectorAll('.tg').forEach(t=>t.addEventListener('click',()=>{if(SEL)drop(SEL,t)}))}
function chipDown(e){const c=e.currentTarget;if(c.classList.contains('done'))return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let gh=null;try{c.setPointerCapture(e.pointerId)}catch(_){}
const mv=ev=>{if(!gh&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){gh=c.cloneNode(true);gh.className='chip ghost';document.body.appendChild(gh);c.classList.add('drag')}if(gh){gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px';const h=document.elementFromPoint(ev.clientX,ev.clientY),ht=h&&h.closest('.tg');document.querySelectorAll('.tg.hov').forEach(x=>x!==ht&&x.classList.remove('hov'));if(ht&&!ht.classList.contains('ok'))ht.classList.add('hov')}};
const up=ev=>{c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);c.classList.remove('drag');
document.querySelectorAll('.tg.hov').forEach(x=>x.classList.remove('hov'));if(gh){gh.remove();const el=document.elementFromPoint(ev.clientX,ev.clientY),t=el&&el.closest('.tg');if(t&&ev.type=='pointerup')drop(c,t)}else sel(c)};
c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function sel(c){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));if(SEL===c){SEL=null;return}SEL=c;c.classList.add('sel')}
function drop(c,t){SEL=null;c.classList.remove('sel');if(t.classList.contains('ok')||c.classList.contains('done'))return;
if(t.dataset.l==c.dataset.l){const n=+t.dataset.c+1;t.dataset.c=n;c.classList.add('done');const bi=t.querySelector('.bi');
if(bi)bi.insertAdjacentHTML('beforeend',`<span>${c.textContent}</span>`);else if(t.querySelector('b'))t.innerHTML+=` ✅ ${c.textContent}`;else t.textContent=c.textContent;
if(n>=+t.dataset.n)t.classList.add('ok');
if(document.querySelectorAll('.chip:not(.done)').length==0){if(!S.tried)hit();const g=pick(GOOD);mood('happy',g);document.getElementById('fb').innerHTML=g+'<div class="ex">Alles is reg!</div>';next()}else mood('happy','Reg! 👍 Nog een...')}
else{S.tried=true;S.st=0;vib([40,40,40]);t.classList.add('bad');setTimeout(()=>t.classList.remove('bad'),600);mood('sad',pick(BAD))}}
function end(){const n=S.items.length,p=Math.round(S.sc/n*100);let extra='',nb=false;
if(S.mode!='foute'&&(S.mode=='free'||LV[S.lv].test)){const b=best();if(p>(b[S.t]??-1)){b[S.t]=p;sv('nwBest',b);nb=true}}
let s=0;if(S.mode=='lvl'){s=p==100?3:p>=80?2:p>=50?1:0;const st=stars();if(s>(st[S.lv]||0)){st[S.lv]=s;sv('nwStars',st)}
extra=`<div class="big3">${[1,2,3].map(k=>`<span style="animation-delay:${.5+k*.35}s">${k<=s?'⭐':'☆'}</span>`).join('')}</div>`+(s?(S.lv+1<LV.length?`<p>🔓 Volgende vlak oop: <b>${LV[S.lv+1].n}</b></p><button class="big" onclick="startLevel(${S.lv+1})">Volgende vlak ➜</button>`:''):'<p>Kry minstens 50% om die volgende vlak oop te sluit.</p>')}
if(S.mode=='foute')extra=`<p>Foute oor: ${foute().length}</p>`;
const bd=[],BG={A:'🌟 Ruimte-Ster',G:'🌱 Grond-Genie',S:'🧱 Rots-Ridder',F:'🦕 Fossiel-Speurder'};if(p>=80)Object.keys(BG).forEach(k=>{if(S.t==k||S.t=='X')bd.push(BG[k])});if(S.max>=5)bd.push(`🔥 Vuurstreep (${S.max} op 'n ry)`);if(p==100)bd.push('👑 Perfek!');
const msg=p>=80?'Jy is fantasties! 🎉':p>=50?'Mooi so! Oefen nog \'n bietjie 💜':'Goeie poging! Probeer weer, jy gaan dit kry 💪';
app.innerHTML=`<div class="bar"><div class="fill" style="width:100%"></div></div><div class="card center">${masc(p>=50?'happy':'sad',msg)}
<div class="score"><span id="cu" data-to="${S.sc}">0</span> / ${n}</div><h2>${p}%</h2>${extra}${nb?'<p>✨ Nuwe beste telling!</p>':''}<div>${bd.map((x,k)=>`<span class="badge" style="animation-delay:${1.7+k*.25}s">${x}</span>`).join('')}</div>
<button class="teal" onclick="${S.mode=='lvl'?`startLevel(${S.lv})`:S.mode=='foute'?'startFoute()':`startFree('${S.t}','${S.m}')`}">Probeer weer 🔁</button><button class="teal" onclick="home()">Tuis 🏠</button></div>`;countUp();if(p>=80)setTimeout(confetti,600)}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(){const e=document.getElementById('cu');if(!e)return;const to=+e.dataset.to;if(RM||!to){e.textContent=to;return}const t0=performance.now(),D=900;(function f(t){const k=Math.min(1,(t-t0)/D);e.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
let CF=0;function stopCf(){cancelAnimationFrame(CF);const c=document.getElementById('cf');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function confetti(){stopCf();const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const col=['#c77dff','#ff8fc8','#43c6c0','#ffd166','#fff'];
let P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:4+Math.random()*5,v:2+Math.random()*3,s:Math.random()*6,c:pick(col)})),t=0;
(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(t/20+p.s);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++t<240)CF=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
new MutationObserver(()=>{app.classList.remove('in');void app.offsetWidth;app.classList.add('in');requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fill[data-w]').forEach(f=>f.style.width=f.dataset.w+'%')))}).observe(app,{childList:true});
(function(){const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,St;function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0);St=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,p:Math.random()*6,s:.5+Math.random()*1.5}))}
rs();addEventListener('resize',rs);let last=0;function f(t){if(t-last>66){last=t;x.clearRect(0,0,W,H);for(const s of St){x.globalAlpha=RM?.7:.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}}if(!RM&&!document.hidden)requestAnimationFrame(f)}requestAnimationFrame(f);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!RM)requestAnimationFrame(f)})})();
home();
</script></body></html>
