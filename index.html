<!DOCTYPE html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NW Gr. 5 Planeet Aarde Quiz 🚀</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#2a1b4d,#5b3a8c 50%,#2f7f86);color:#2a1b4d;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:14px}.card{background:#fff8fd;border-radius:22px;padding:18px;box-shadow:0 8px 30px #0004;margin-top:12px}
h1{color:#fff;text-align:center;font-size:1.5em;margin:10px 0 0}.sub{color:#ffd6f0;text-align:center;margin:4px 0}
button{font:inherit;border:0;border-radius:16px;padding:13px;margin:6px 0;width:100%;cursor:pointer;background:#efe6ff;color:#2a1b4d;font-size:1.02em;text-align:left}
button.big{background:linear-gradient(90deg,#c77dff,#ff8fc8);color:#fff;text-align:center;font-weight:700}
button.teal{background:linear-gradient(90deg,#43c6c0,#7fd8f0);color:#fff;text-align:center;font-weight:700}
.ok{background:#b9f5d8!important}.bad{background:#ffc9d6!important}
.bar{height:12px;background:#ffffff40;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#ff8fc8,#7fd8f0);width:0;transition:width .4s}
.top{display:flex;justify-content:space-between;color:#fff;font-weight:600;margin-top:8px}
.q{font-size:1.15em;font-weight:700;margin-bottom:8px}.tag{display:inline-block;background:#e0f7f6;color:#21706c;border-radius:9px;padding:2px 8px;font-size:.8em;margin-bottom:6px}
.fb{min-height:1.5em;font-weight:700;margin-top:6px}.ex{font-size:.92em;color:#5b3a8c;margin-top:4px}
.badge{display:inline-block;background:#fff0fa;border:2px solid #ff8fc8;border-radius:14px;padding:6px 10px;margin:4px}
.center{text-align:center}canvas{position:fixed;inset:0;pointer-events:none}
</style></head><body><canvas id="cf"></canvas><div class="wrap">
<h1>🌍 Planeet Aarde Quiz 🚀</h1><div class="sub">Natuurwetenskap Gr. 5</div><div id="app"></div></div>
<script>
// [vraag, opsies, korrek-indeks, verduideliking, onderwerp]  A=Aarde beweeg, G=Oppervlak/grond
const Q=[
["Wat stel A en B in die prent voor?",["A = die Son, B = die Aarde","A = die Aarde, B = die Maan","A = die Maan, B = die Son"],0,"A is die Son en B is die Aarde.","A"],
["Wat noem ons die baan waarop die Aarde om die Son beweeg?",["Die as","Die wentelbaan","Die ewenaar"],1,"Dit is die wentelbaan.","A"],
["Wat noem ons die beweging van die Aarde om die Son?",["Rotasie","Omwenteling","Erosie"],1,"Omwenteling: die Aarde wentel om die Son.","A"],
["Op watter ander manier beweeg die Aarde ook?",["Dit roteer (draai) om sy eie as","Dit spring op en af","Dit staan stil"],0,"Die Aarde roteer om sy eie as.","A"],
["Kan 'n mens die beweging van die Aarde voel?",["Ja, dit skud","Nee, want ons beweeg saam met die Aarde","Net in die nag"],1,"Nee, ons beweeg saam met die Aarde.","A"],
["Wat is 'n wentelbaan?",["Die draaibeweging om sy eie as","Die baan wat 'n voorwerp volg om 'n ander voorwerp","'n Lyn deur die Aarde"],1,"Die baan wat 'n voorwerp volg wanneer dit om 'n ander voorwerp beweeg.","A"],
["Wat is die Aarde se as?",["'n Regte staaf deur die Aarde","'n Denkbeeldige lyn van noord na suid deur die middelpunt","Die rand van die wentelbaan"],1,"Die as is 'n denkbeeldige lyn, nie 'n regte staaf nie.","A"],
["Wat is rotasie?",["Die draaibeweging van 'n voorwerp om sy eie as","Die beweging om die Son","Die tyd van een jaar"],0,"Rotasie = draai om sy eie as.","A"],
["Hoeveel dae neem die Aarde om een maal om die Son te wentel?",["24","30","365¼"],2,"Ongeveer 365¼ dae: een jaar.","A"],
["Hoeveel uur neem die Aarde om een maal om sy as te draai?",["12","24","365"],1,"24 uur: een dag.","A"],
["In watter rigting beweeg die Aarde om die Son?",["Kloksgewys","Antikloksgewys","Op en af"],1,"Antikloksgewys.","A"],
["Die Aarde draai van ...",["oos na wes","wes na oos","noord na suid"],1,"Van wes na oos.","A"],
["Hoeveel maal roteer die Aarde in een week?",["Een","Sewe","365"],1,"Een keer per dag, dus sewe maal.","A"],
["Waar of onwaar? Die hele Aarde kry op dieselfde tyd sonlig.",["Waar","Onwaar"],1,"Onwaar: net die helfte wat na die Son draai, kry lig.","A"],
["Waar of onwaar? Die Aarde is in die winter en somer op dieselfde plek op sy wentelbaan.",["Waar","Onwaar"],1,"Onwaar: in verskillende maande is dit op verskillende plekke.","A"],
["Lemoenmodel: wat stel die flitslig voor?",["Die Aarde","Die as","Die Son"],2,"Lemoen = Aarde, stokkie = as, flitslig = Son.","A"],
["Watter beweging wys jy as jy die lemoen draai?",["Rotasie","Omwenteling","Erosie"],0,"Rotasie.","A"],
["Wat ervaar mense waar die Son se lig skyn?",["Nag","Dag","Winter"],1,"Waar die lig skyn is dit dag, elders nag.","A"],
["Wat noem ons die harde, rotsagtige laag op die oppervlak van die Aarde?",["Die kern","Die kors","Die bogrond"],1,"Die kors.","G"],
["Waar of onwaar? Die Aarde se kors hou by die oseaan op.",["Waar","Onwaar"],1,"Onwaar: die kors kom ook onder die oseane voor.","G"],
["Watter 4 dinge hou lewe op Aarde in stand?",["Grond, lug, water en sonlig","Rotse, sand, wind en reën","Kos, huise, klere en water"],0,"Grond, lug, water en sonlig.","G"],
["Water, lug, grond en sonlig → voedsel vir ... → voedsel vir ...",["diere → plante","plante → diere","rotse → plante"],1,"Plante maak voedsel, en diere eet plante.","G"],
["Wat is die tweede laag grond?",["Bogrond","Ondergrond","Soliede rots"],1,"Ondergrond.","G"],
["Watter volgorde is reg (van bo na onder)?",["Bogrond, ondergrond, stukke rots en grond, soliede rots","Ondergrond, bogrond, soliede rots, stukke rots","Soliede rots, ondergrond, bogrond, stukke rots"],0,"Bogrond → ondergrond → stukke rots en grond → soliede rots.","G"],
["Waarom is bogrond donker en vrugbaar?",["Dit is nat","Dit bevat humus wat voedingstowwe gee","Dit is vol klippe"],1,"Humus (reste van dooie plante en diere) gee voedingstowwe.","G"],
["Wat gebeur met voedingstowwe in die bogrond as dit reën?",["Dit word tot in die ondergrond gespoel","Dit verdwyn in die lug","Dit word klip"],0,"Dit spoel tot in die ondergrond.","G"],
["Wat beteken ontbind?",["Om vas te bind","Om tot kleiner dele af te breek","Om te groei"],1,"Om tot kleiner dele af te breek.","G"],
["Hoe breek rotse naby die oppervlak op?",["Water en lug, en plantwortels in krake","Mense wat daarop loop","Die Maan trek daaraan"],0,"Water en lug verswak rotse; wortels maak krake wyer.","G"],
["Watter instrument laat klein goedjies baie groter lyk?",["'n Teleskoop","'n Mikroskoop","'n Termometer"],1,"'n Mikroskoop.","G"],
["Hoe voel nat kleigrond?",["Grinterig","Klewerig","Hard en droog"],1,"Nat klei is klewerig; droë klei glad; sand grinterig.","G"],
["Hoe voel sandgrond?",["Grinterig","Klewerig","Glad"],0,"Sand voel grinterig.","G"],
["Wat is humus?",["Klein klippies","Donker materiaal van ten volle ontbinde reste van plante en diere","'n Soort klei"],1,"Humus is donker, ontbinde plant- en dierereste.","G"],
["Watter grond bestaan meestal uit groot (growwe) korrels?",["Sandgrond","Kleigrond","Leemgrond"],0,"Sandgrond.","G"],
["Watter grond bestaan meestal uit klein (fyn) korrels?",["Sandgrond","Kleigrond","Leemgrond"],1,"Kleigrond.","G"],
["Watter grond droog die vinnigste uit?",["Sandgrond","Kleigrond","Leemgrond"],0,"Sandgrond.","G"],
["Watter grond is die beste vir plante?",["Sandgrond","Kleigrond","Leemgrond"],2,"Leemgrond: humus met voedingstowwe en hou water goed.","G"],
["Watter grond is 'n mengsel van korrelgroottes en bevat humus?",["Sandgrond","Leemgrond","Kleigrond"],1,"Leemgrond.","G"],
["Hoe help erdwurms die grond?",["Hulle meng blare en reste in die grond en maak ruimte vir lug en water","Hulle maak die grond hard","Hulle eet al die humus op"],0,"Hulle meng reste in en maak ruimte vir lug en water.","G"],
["Wat doen die baie klein organismes in die grond?",["Hulle ontbind die reste van dooie plante en diere","Hulle maak rotse","Hulle drink al die water"],0,"Hulle ontbind (eet) reste.","G"],
["Wat is erosie?",["Wanneer bogrond deur water weggespoel of deur wind weggewaai word","Wanneer plante groei","Wanneer die Aarde draai"],0,"Erosie: water of wind neem die bogrond weg.","G"],
["Waar of onwaar? 'n Nuwe laag bogrond word elke jaar gevorm.",["Waar","Onwaar"],1,"Onwaar: grond vorm baie stadig, oor duisende jare.","G"],
["Hoekom moet boere gronderosie voorkom?",["Bogrond kan nie vervang word nie en ons kweek kos daarin","Dit maak die plaas mooi","Erosie maak reën"],0,"Bogrond kan nie vervang word nie en ons het dit nodig vir kos.","G"]];
const GOOD=["Fantasties! 🌟","Wow, slim kop! 🧠","Jy's 'n ster! ⭐","Uitstekend! 🎉","Super! 💖","Reg so! 🚀"],
BAD=["Amper! Probeer weer 💪","Nie heeltemal nie, jy kry dit! 🌈","Oeps! Kyk weer 👀","Hou aan, jy leer! 💜"];
const app=document.getElementById('app');let S;const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const best=()=>JSON.parse(localStorage.getItem('nwBest')||'{}');
function home(){const b=best();app.innerHTML=`<div class="card center"><div style="font-size:3em">🪐</div>
<p>Kies 'n onderwerp en 'n modus. Elke regte antwoord gee jou 'n ⭐!</p>
<button class="big" onclick="start('A','o')">🌍 Die Aarde beweeg: Oefenmodus</button>
<button class="big" onclick="start('G','o')">🌱 Die oppervlak van die Aarde: Oefenmodus</button>
<button class="teal" onclick="start('X','t')">📝 Toetsmodus: alles gemeng (punte aan die einde)</button>
<p>🏆 Beste tellings: Aarde ${b.A??'-'}% · Grond ${b.G??'-'}% · Toets ${b.X??'-'}%</p></div>`}
function start(t,m){stopCf();S={t,m,qs:shuf(Q.filter(q=>t=='X'||q[4]==t)).map(q=>{const o=q[1].map((x,i)=>[x,i==q[2]]);return [q[0],q[1].length==2?o:shuf(o),q[3],q[4]]}),i:0,sc:0,st:0,max:0,tried:false};show()}
function show(){const q=S.qs[S.i],n=S.qs.length;S.tried=false;app.innerHTML=`<div class="top"><span>Vraag ${S.i+1}/${n}</span><span>🔥 ${S.st} · ⭐ ${S.sc}</span></div>
<div class="bar"><div class="fill" style="width:${S.i/n*100}%"></div></div><div class="card"><span class="tag">${q[3]=='A'?'🌍 Die Aarde beweeg':'🌱 Oppervlak van die Aarde'}</span>
<div class="q">${q[0]}</div>${q[1].map((o,k)=>`<button id="b${k}" onclick="ans(${k})">${o[0]}</button>`).join('')}<div class="fb" id="fb"></div><div id="nx"></div></div>`}
function ans(k){const q=S.qs[S.i],b=document.getElementById('b'+k),fb=document.getElementById('fb');if(b.disabled)return;const right=q[1][k][1];
if(S.m=='o'){if(right){b.classList.add('ok');if(!S.tried){S.sc++;S.st++;S.max=Math.max(S.max,S.st)}fb.innerHTML=pick(GOOD)+(S.st>=3?` 🔥 ${S.st} op 'n ry!`:'')+`<div class="ex">${q[2]}</div>`;lock();next()}
else{b.classList.add('bad');b.disabled=true;S.tried=true;S.st=0;fb.textContent=pick(BAD)}}
else{if(right){S.sc++;S.st++;S.max=Math.max(S.max,S.st)}else S.st=0;S.i++;S.i<S.qs.length?show():end()}}
function lock(){document.querySelectorAll('.card button').forEach(x=>x.disabled=true)}
function next(){document.getElementById('nx').innerHTML=`<button class="big" onclick="S.i++;S.i<S.qs.length?show():end()">Volgende ➜</button>`}
function end(){const n=S.qs.length,p=Math.round(S.sc/n*100),b=best(),nb=p>(b[S.t]??-1);if(nb){b[S.t]=p;localStorage.setItem('nwBest',JSON.stringify(b))}
const bd=[];if(p>=80&&S.t!='G')bd.push('🌟 Ruimte-Ster');if(p>=80&&S.t!='A')bd.push('🌱 Grond-Genie');if(S.max>=5)bd.push(`🔥 Vuurstreep (${S.max} op 'n ry)`);if(p==100)bd.push('👑 Perfek!');
const msg=p>=80?'Jy is fantasties! 🎉':p>=50?'Mooi so! Oefen nog \'n bietjie 💜':'Goeie poging! Probeer weer, jy gaan dit kry 💪';
app.innerHTML=`<div class="bar"><div class="fill" style="width:100%"></div></div><div class="card center"><div style="font-size:3em">${p>=80?'🏆':p>=50?'🌈':'💪'}</div>
<h2>${S.sc} / ${n} (${p}%)</h2><p>${msg}</p>${nb?'<p>✨ Nuwe beste telling!</p>':''}<div>${bd.map(x=>`<span class="badge">${x}</span>`).join('')}</div>
<button class="big" onclick="start('${S.t}','${S.m}')">Probeer weer 🔁</button><button class="teal" onclick="home()">Tuis 🏠</button></div>`;if(p>=80)confetti()}
let CF=0;function stopCf(){cancelAnimationFrame(CF);const c=document.getElementById('cf');c.getContext('2d').clearRect(0,0,c.width,c.height)}
function confetti(){stopCf();const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const col=['#c77dff','#ff8fc8','#43c6c0','#ffd166','#fff'];
let P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:4+Math.random()*5,v:2+Math.random()*3,s:Math.random()*6,c:pick(col)})),t=0;
(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(t/20+p.s);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++t<240)CF=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
home();
</script></body></html>
