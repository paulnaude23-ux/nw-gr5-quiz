const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rp=a=>a[Math.floor(Math.random()*a.length)];
function fmt(n){const neg=n<0;n=Math.abs(n);const [i,d]=String(n).split('.');const g=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'-':'')+g+(d!==undefined?','+d:'')}
function stripUnits(s){return (''+s).replace(/cm\^?3|cm³|cm2|cm²|\bml\b|\bmm\b|\bcm\b|\bkm\b|\bkg\b|\bg\b|ℓ|\bmin\b|\buur\b/gi,'').replace(/l$/i,'')}
function normExpr(s){s=stripUnits(''+s).trim();
 s=s.replace(/[×⁎∗]/g,'*').replace(/(?<=[\d)])\s*[xX]\s*(?=[\d(])/g,'*').replace(/[−–—‒]/g,'-').replace(/÷/g,'/');
 s=s.replace(/(\d)\s+(?=\d)/g,'$1');
 s=s.replace(/(\d),(\d)/g,'$1.$2');
 return s}
function evalExpr(s){let t=normExpr(s).replace(/\s+/g,'');
 if(!t)return NaN;
 if(t.includes('=')){const sides=t.split('=').filter(Boolean).map(evalExpr);if(!sides.length||sides.some(v=>!isFinite(v)))return NaN;if(sides.length>1&&sides.some(v=>Math.abs(v-sides[0])>1e-9))return NaN;return sides[0]}
 if(!/^-?[\d.+*/()-]+$/.test(t))return NaN;
 try{const v=Function('"use strict";return ('+t+')')();return typeof v==='number'&&isFinite(v)?v:NaN}catch(e){return NaN}}
function parseAns(s){const raw=(''+s).trim();
 let t=stripUnits(raw).trim().toLowerCase();
 const packed=t.replace(/\s+/g,'');
 if(/(?:restant|oorskot)|(?:^|\d)r\d/.test(packed)){const m=packed.replace(/^r/,'').match(/(-?\d+(?:[.,]\d+)?)(?:restant|oorskot|r)(-?\d+)/);if(m)return {n:+m[1].replace(',','.'),r:+m[2],kind:'rem'}}
 const ev=evalExpr(raw);
 return {n:ev,kind:'num',raw}}
function numEq(user,exp){if(exp==null)return false;
 if(Array.isArray(exp))return exp.some(e=>numEq(user,e));
 if(typeof exp==='object'&&exp.rem!=null){const u=parseAns(user);if(u.kind==='rem')return u.n===exp.q&&u.r===exp.rem;if(u.kind==='num'&&exp.rem===0)return u.n===exp.q;return false}
 if(typeof exp==='string'){const es=normExpr(exp).replace(/\s+/g,'').toLowerCase();const us=normExpr(user).replace(/\s+/g,'').toLowerCase();if(us===es)return true}
 const ev=typeof exp==='number'?exp:evalExpr(exp);
 const uv=evalExpr(user);
 if(isFinite(uv)&&isFinite(ev)&&Math.abs(uv-ev)<1e-9)return true;
 const u=parseAns(user);
 if(u.kind==='num'&&isFinite(u.n)&&isFinite(ev)&&Math.abs(u.n-ev)<1e-9)return true;
 return false}

function Witem(o){return Object.assign({k:'w',tag:'Wiskunde'},o)}

/* ---- generators ---- */
function gSyfers(){const n=ri(100000,999999);return Witem({typ:'type',tag:'Heelgetalle',q:`Skryf in syfers: <b>${fmt(n)}</b> is alreeds in syfers… wag, wat is die getal as jy dit so lees: <b>${fmt(n)}</b>? Skryf die getal.`,a:n,exp:`Die getal is ${fmt(n)}.`,easy:1})}
function gPlek(){const n=ri(100000,999999);const s=String(n);const i=ri(0,s.length-1);const dig=+s[i];const val=dig*Math.pow(10,s.length-1-i);
  const plek=['honderdduisende','tienduisende','duisende','honderde','tiene','eenhede'][i];
  return Witem({typ:'type',tag:'Plekwaarde',q:'Wat is die plekwaarde van die syfer <b>'+dig+'</b> in <b>'+fmt(n)+'</b>?',a:[val,fmt(val)],exp:'Die '+dig+' staan in die '+plek+'-plek, dus is die plekwaarde '+fmt(val)+'.'})}
function gRang(){let a=[];while(a.length<4){const n=ri(10000,99999);if(!a.includes(n))a.push(n)}
  const up=Math.random()<.5;const sorted=a.slice().sort((x,y)=>up?x-y:y-x);
  return Witem({typ:'order',tag:'Rangskik',q:`Tik die getalle van die <b>${up?'kleinste na die grootste':'grootste na die kleinste'}</b>.`,opts:a.map(fmt),a:sorted.map(fmt),exp:`Die regte volgorde is ${sorted.map(fmt).join(' ; ')}.`})}
function gAfrond(){const kind=rp([5,10,100,1000]);const n=kind===5?ri(20,999):ri(1000,99999);const a=kind*Math.round(n/kind);
  return Witem({typ:'type',tag:'Afronding',q:`Rond <b>${fmt(n)}</b> af tot die naaste ${fmt(kind)}.`,a:[a,fmt(a)],exp:`${fmt(n)} afgerond tot die naaste ${fmt(kind)} is ${fmt(a)}.`})}
function gTel(){const st=rp([25,50,100,1000]);const start=st*ri(8,40);const dir=rp([1,-1]);const seq=[start,start+dir*st,start+2*dir*st];
  const ans1=start+3*dir*st,ans2=start+4*dir*st;
  return Witem({typ:'type',tag:'Tel',q:`Tel ${dir>0?'vorentoe':'agteruit'} in ${st}’s: <b>${seq.map(fmt).join(' ; ')} ; ________ ; ________</b><br>Skryf die twee ontbrekende getalle, geskei met ’n kommapunt of spasie.`,a:{two:[ans1,ans2]},exp:`Die volgende twee getalle is ${fmt(ans1)} en ${fmt(ans2)}.`})}
function gVergelyk(){let a=ri(10000,99999),b=ri(10000,99999);if(Math.random()<.2)b=a;
  const sym=a>b?'>':a<b?'<':'=';
  return Witem({typ:'choice',tag:'Vergelyk',q:`Kies die regte teken: <b>${fmt(a)}  ☐  ${fmt(b)}</b>`,opts:['>','<','='],ai:['>','<','='].indexOf(sym),exp:`${fmt(a)} ${sym} ${fmt(b)}`})}
function gUitrek(){const n=ri(10000,99999);const s=String(n);const parts=[];for(let i=0;i<s.length;i++){if(s[i]!='0')parts.push(+s[i]*10**(s.length-1-i))}
  return Witem({typ:'type',tag:'Uitgerekte notasie',q:`Skryf <b>${fmt(n)}</b> in uitgerekte notasie. (bv. 300 000 + 4 000 + 20)`,a:parts.join('+'),exp:`${fmt(n)} = ${parts.map(fmt).join(' + ')}.`,check:'expand'})}

function gSin(){const typ=ri(0,3);
  if(typ===0){const a=ri(2000,8000)*10,s=ri(1000,4000)*10;return Witem({typ:'type',tag:'Getalsin',q:`${fmt(a)} + ________ = ${fmt(a+s)}. Wat is die ontbrekende getal?`,a:s,exp:`${fmt(a)} + ${fmt(s)} = ${fmt(a+s)}.`})}
  if(typ===1){const b=ri(2,12),p=ri(2,12);return Witem({typ:'type',tag:'Getalsin',q:`${b} × ________ = ${b*p}. Wat is die ontbrekende getal?`,a:p,exp:`${b} × ${p} = ${b*p}. Albei getalle is in die tafels tot 12.`})}
  if(typ===2){const b=ri(2,12),p=ri(2,12);return Witem({typ:'type',tag:'Getalsin',q:`________ ÷ ${b} = ${p}. Wat is die ontbrekende heelgetal?`,a:b*p,exp:`${b*p} ÷ ${b} = ${p}. Dit is ${b} × ${p}, nog binne die tafels tot 12.`})}
  const pak=ri(2,6),elk=ri(2,12),weg=ri(1,pak*elk-1);return Witem({typ:'type',tag:'Getalsin',q:`Thabo het ${pak} pakke met ${elk} potlode elk. Hy gee ${weg} weg. Hoeveel het hy oor?`,a:pak*elk-weg,exp:`(${pak} × ${elk}) − ${weg} = ${pak*elk-weg}.`})}

function gOptel(){const typ=ri(0,2);
  if(typ===0){const a=ri(10000,89999),b=ri(10000,99999-a);return Witem({typ:'type',tag:'Optel',q:`Bereken: <b>${fmt(a)} + ${fmt(b)}</b>`,a:a+b,exp:`${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}.`})}
  if(typ===1){const a=ri(20000,90000),b=ri(10000,a-1000);return Witem({typ:'type',tag:'Aftrek',q:`Bereken: <b>${fmt(a)} − ${fmt(b)}</b>`,a:a-b,exp:`${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}.`})}
  const spaar=ri(15000,40000),kos=ri(5000,spaar-1000);return Witem({typ:'type',tag:'Woordsom',q:`Lisa het R${fmt(spaar)} gespaar. Sy koop iets vir R${fmt(kos)}. Hoeveel het sy oor?`,a:spaar-kos,exp:`R${fmt(spaar)} − R${fmt(kos)} = R${fmt(spaar-kos)}.`})}

function gVerm(){const typ=ri(0,2);
  if(typ===0){const a=ri(12,99),b=ri(2,9);return Witem({typ:'type',tag:'Vermenigvuldig',q:`Bereken: <b>${a} × ${b}</b>`,a:a*b,exp:`${a} × ${b} = ${fmt(a*b)}.`})}
  if(typ===1){const a=ri(100,400),b=rp([2,3,4,5,10,12]);return Witem({typ:'type',tag:'Vermenigvuldig',q:`Bereken: <b>${fmt(a)} × ${b}</b> (jy mag op papier werk).`,a:a*b,exp:`${fmt(a)} × ${b} = ${fmt(a*b)}. Breek ${b} op as jy wil.`})}
  const dos=rp([6,8,10,12]),aant=ri(2,12);return Witem({typ:'type',tag:'Woordsom',q:`’n Doos bevat ${dos} potlode. Die skool koop ${aant} dosies. Hoeveel potlode is dit altesaam?`,a:dos*aant,exp:`${aant} × ${dos} = ${fmt(dos*aant)}.`})}

function gDeel(){const typ=ri(0,3);
  if(typ===0){const b=ri(2,12),q=ri(2,12);return Witem({typ:'type',tag:'Deling',q:`Bereken: <b>${b*q} ÷ ${b}</b>`,a:q,exp:`${b*q} ÷ ${b} = ${q}. Die antwoord is ’n heelgetal uit die tafels tot 12.`})}
  if(typ===1){const b=ri(2,9),q=ri(6,20);return Witem({typ:'type',tag:'Deling',q:`Bereken: <b>${b*q} ÷ ${b}</b>`,a:q,exp:`${b*q} ÷ ${b} = ${q}.`})}
  if(typ===2){const b=rp([10,12,15,20,25]),q=ri(2,12);return Witem({typ:'type',tag:'Deling',q:`Bereken: <b>${b*q} ÷ ${b}</b>`,a:q,exp:`${b*q} ÷ ${b} = ${q}. Jy kan deur 10, 12, 15, 20 of 25 breek.`})}
  const b=rp([2,3,4,5,6,8,10]),q=ri(2,12),r=ri(0,b-1),n=b*q+r;
  return Witem({typ:'type',tag:'Woordsom',q:`${n} leerders word in groepe van ${b} verdeel. Hoeveel <b>volle groepe</b> is daar, en hoeveel leerders bly oor?<br>Skryf bv. <b>${q} restant ${r}</b>.`,a:{q,rem:r},exp:`${q} volle groepe en ${r} oorbly. ${b} × ${q} + ${r} = ${n}.`})}

function gPat(){const typ=ri(0,2);
  if(typ===0){const s=ri(3,9),a=ri(2,20);const seq=[a,a+s,a+2*s,a+3*s];return Witem({typ:'type',tag:'Numeriese patroon',q:`Voltooi die patroon: <b>${seq.join(' ; ')} ; ________ ; ________</b>`,a:{two:[a+4*s,a+5*s]},exp:`Die verskil is +${s}, dus ${a+4*s} en ${a+5*s}.`})}
  if(typ===1){const m=ri(2,5),c=ri(1,9);const ins=[3,5,7,10];const outs=ins.map(x=>x*m+c);
    return Witem({typ:'type',tag:'Intree/uittree',q:`Die reël is: vermenigvuldig met ${m} en tel ${c} by. Wat is die uittree vir intree <b>10</b>?<br><small>Kontrole: 3 → ${outs[0]}, 5 → ${outs[1]}, 7 → ${outs[2]}.</small>`,a:outs[3],exp:`10 × ${m} + ${c} = ${outs[3]}.`})}
  const n=ri(6,12);return Witem({typ:'type',tag:'Meetkundige patroon',q:`’n Stokkiepatroon: Figuur 1 het 3 stokkies, Figuur 2 het 5, Figuur 3 het 7 (tel telkens 2 by). Hoeveel stokkies het <b>Figuur ${n}</b>?`,a:2*n+1,exp:`Stokkies = 2 × ${n} + 1 = ${2*n+1}.`})}

function tenths(n){const w=Math.floor(Math.abs(n)/10),t=Math.abs(n)%10;return (n<0?'-':'')+(t?w+','+t:String(w))}
function gBreuk(){const typ=ri(0,6);
  if(typ===0){const k=rp([2,3,4,5,6,8]);const n=2;const den=k*n;const num=rp([1,2])*n; if(num>=den)return gBreuk();
    return Witem({typ:'type',tag:'Gelykwaardige breuke',q:`Skryf ’n breuk wat gelykwaardig is aan <b>${num/n}/${k}</b> (maar nie dieselfde nie). Skryf as teller/noemer, bv. 4/6.`,a:{eq:[num/n,k]},exp:`Bv. ${num}/${den} is gelykwaardig aan ${num/n}/${k}.`,check:'eq'})}
  if(typ===1){const sets=[[[1,2],[1,4],[3,4],[1,8]],[[1,3],[1,6],[2,3],[5,6]],[[1,5],[2,5],[3,5],[4,5]]];
    const dens=rp(sets);const sh=shuf(dens.slice());
    const lab=sh.map(([a,b])=>`${a}/${b}`);
    const sorted=dens.slice().sort((p,q)=>p[0]/p[1]-q[0]/q[1]).map(([a,b])=>`${a}/${b}`);
    return Witem({typ:'order',tag:'Rangskik breuke',q:`Rangskik van die kleinste na die grootste.`,opts:lab,a:sorted,exp:`Die volgorde is ${sorted.join(' ; ')}.`})}
  if(typ===2){const d=rp([2,3,4,5,6,8,10]);const a=ri(1,d-1),b=ri(1,d-a);if(a+b>d)return gBreuk();
    return Witem({typ:'type',tag:'Tel breuke by',q:`Bereken: <b>${a}/${d} + ${b}/${d}</b>. Skryf as ’n breuk (jy mag vereenvoudig).`,a:{frac:[a+b,d]},exp:`${a}/${d} + ${b}/${d} = ${a+b}/${d}. Dieselfde noemer: tel net die tellers.`,check:'frac'})}
  if(typ===3){const d=rp([3,4,5,6,8,10]);const a=ri(2,d-1),b=ri(1,a-1);
    return Witem({typ:'type',tag:'Trek breuke af',q:`Bereken: <b>${a}/${d} − ${b}/${d}</b>. Skryf as ’n breuk (jy mag vereenvoudig).`,a:{frac:[a-b,d]},exp:`${a}/${d} − ${b}/${d} = ${a-b}/${d}.`,check:'frac'})}
  if(typ===4){const wh=rp([12,16,18,20,24,30,36,40]);
    const dens=[2,3,4,5,6,8,10].filter(d=>wh%d===0&&wh/d!==wh);const den=rp(dens),num=den===4&&wh%4===0&&Math.random()<.5?3:1;
    if(num>=den||(wh*num)%den)return gBreuk();const ans=wh*num/den;
    return Witem({typ:'type',tag:'Breuk van ’n getal',q:'Wat is <b>'+num+'/'+den+'</b> van <b>'+wh+'</b>? Die antwoord is ’n heelgetal.',a:ans,exp:num+'/'+den+' van '+wh+' = '+ans+'. Deel deur die noemer, dan maal met die teller.'})}
  if(typ===5){const x=ri(1,30),y=ri(1,20);if(x===y)return gBreuk();const sx=tenths(x),sy=tenths(y);
    const sym=x>y?'>':x<y?'<':'=';
    return Witem({typ:'choice',tag:'Desimale breuke',q:`Kies die regte teken: <b>${sx}  ☐  ${sy}</b>`,opts:['>','<','='],ai:['>','<','='].indexOf(sym),exp:`${sx} ${sym} ${sy}. Kyk eers na die syfer voor die komma.`})}
  const kind=rp(['add','sub','ten','hund']);
  if(kind==='add'){const x=ri(1,40),y=ri(1,20);return Witem({typ:'type',tag:'Desimale breuke',q:`Bereken: <b>${tenths(x)} + ${tenths(y)}</b>`,a:(x+y)/10,exp:`${tenths(x)} + ${tenths(y)} = ${tenths(x+y)}.`})}
  if(kind==='sub'){let x=ri(5,40),y=ri(1,x-1);return Witem({typ:'type',tag:'Desimale breuke',q:`Bereken: <b>${tenths(x)} − ${tenths(y)}</b>`,a:(x-y)/10,exp:`${tenths(x)} − ${tenths(y)} = ${tenths(x-y)}.`})}
  if(kind==='ten'){const x=ri(1,25);return Witem({typ:'type',tag:'Desimale breuke',q:`Bereken: <b>${tenths(x)} × 10</b>`,a:x,exp:`${tenths(x)} × 10 = ${x}. Die komma skuif een plek na regs.`})}
  const c=rp([5,15,25,40,50,75]);return Witem({typ:'type',tag:'Desimale breuke',q:`Bereken: <b>0,${String(c).padStart(2,'0')} × 100</b>`,a:c,exp:`0,${String(c).padStart(2,'0')} × 100 = ${c}.`})}
function gVorm(){const typ=ri(0,3);
  if(typ===0){const shapes=[['Vierkant',sqSVG()],['Reghoek',rectSVG()],['Driehoek',triSVG()],['Seshoek',hexSVG()]];
    const i=ri(0,3);const sh=shuf(shapes.slice());
    return Witem({typ:'choice',tag:'2D-vorms',q:`Wat is die naam van hierdie vorm?<br>${shapes[i][1]}`,opts:sh.map(s=>s[0]),ai:sh.findIndex(s=>s[0]===shapes[i][0]),exp:`Dit is ’n ${shapes[i][0].toLowerCase()}.`})}
  if(typ===1){const names=['Kubus','Reghoekige prisma','Silinder','Keël'];
    const pics=[cubeSVG(),prismSVG(),cylSVG(),coneSVG()];
    const i=ri(0,3);const or=shuf([0,1,2,3]);
    return Witem({typ:'choice',tag:'3D-vorms',q:`Wat is die naam van hierdie voorwerp?<br>${pics[i]}`,opts:or.map(k=>names[k]),ai:or.indexOf(i),exp:`Dit is ’n ${names[i].toLowerCase()}.`})}
  if(typ===2){const solids=[{n:'’n kubus',t:[6,12,8]},{n:'’n reghoekige prisma',t:[6,12,8]},{n:'’n silinder',t:[3,2,0]},{n:'’n keël',t:[2,1,1]},{n:'’n vierkantige piramide',t:[5,8,5]}];
    const s=rp(solids);return Witem({typ:'type',tag:'3D-eienskappe',q:`${s.n[0].toUpperCase()+s.n.slice(1)} het hoeveel vlakke, rande en hoekpunte? Skryf drie getalle, bv. <b>6 12 8</b>.`,a:{three:s.t},exp:`${s.n[0].toUpperCase()+s.n.slice(1)} het ${s.t[0]} vlakke, ${s.t[1]} rande en ${s.t[2]} hoekpunte.`})}
  const angles=[{d:'90°',a:'regte hoek',e:'’n Hoek van 90° is ’n regte hoek, soos die hoek van ’n boek.'},{d:'kleiner as 90°',a:'skerp hoek',e:'Kleiner as ’n regte hoek is ’n skerp hoek.'},{d:'groter as 90° maar kleiner as 180°',a:'stomphoek',e:'Groter as 90° en kleiner as 180° is ’n stomphoek.'},{d:'180°',a:'reguit hoek',e:'’n Hoek van 180° is ’n reguit hoek.'}];
  const ang=rp(angles);const opts=['regte hoek','skerp hoek','stomphoek','reguit hoek'];
  return Witem({typ:'choice',tag:'Hoeke',q:`’n Hoek wat ${ang.d} is, noem ons ’n …`,opts:shuf(opts),ai:null,exp:ang.e,ansName:ang.a})}

function gMeting(){const typ=ri(0,5);
  if(typ===0){const m=ri(2,9);return Witem({typ:'type',tag:'Lengte',q:`Skakel om: <b>${m} m = ________ cm</b>`,a:m*100,exp:`1 m = 100 cm, dus ${m} m = ${m*100} cm.`})}
  if(typ===1){const cm=rp([30,45,60,80,120]);return Witem({typ:'type',tag:'Lengte',q:`Skakel om: <b>${cm} cm = ________ mm</b>`,a:cm*10,exp:`1 cm = 10 mm, dus ${cm} cm = ${cm*10} mm.`})}
  if(typ===2){const km=rp([2,3,4,5]);return Witem({typ:'type',tag:'Lengte',q:`Skakel om: <b>${km*1000} m = ________ km</b>`,a:km,exp:`1 km = 1 000 m, dus ${fmt(km*1000)} m = ${km} km.`})}
  if(typ===3){const l=rp([1,2,3,4]);const cup=rp([200,250,500]);return Witem({typ:'type',tag:'Kapasiteit',q:`’n Bottel hou ${l} ℓ. Hoeveel koppies van ${cup} ml elk kan jy uit die volle bottel skink?`,a:(l*1000)/cup,exp:`${l} ℓ = ${fmt(l*1000)} ml; ${fmt(l*1000)} ÷ ${cup} = ${(l*1000)/cup}.`})}
  if(typ===4){const kg=rp([1,2,3]);const g=rp([250,500,750]);return Witem({typ:'type',tag:'Massa',q:`${kg} kg ${g>0?`+ ${g} g`:''} = ________ g`,a:kg*1000+g,exp:`${kg} kg = ${fmt(kg*1000)} g, plus ${g} g = ${fmt(kg*1000+g)} g.`})}
  const h=ri(13,16),m=rp([0,10,15,20,30,40,45]);
  const addh=1,addm=rp([20,30,40,50,55]);
  let nh=h+addh,nm=m+addm;if(nm>=60){nh++;nm-=60}
  const pad=x=>String(x).padStart(2,'0');
  return Witem({typ:'type',tag:'Tyd',q:`’n Film begin om <b>${h}:${pad(m)}</b> en duur ${addh} uur ${addm} minute. Wanneer is dit verby? Skryf as uu:mm (24-uur-tyd).`,a:`${nh}:${pad(nm)}`,exp:`${h}:${pad(m)} + ${addh} uur ${addm} min = ${nh}:${pad(nm)}.`,check:'time'})}

function gOmtrek(){const typ=ri(0,4);
  if(typ===0){const l=ri(5,15),b=ri(3,10);return Witem({typ:'type',tag:'Omtrek',q:`’n Reghoek is ${l} cm lank en ${b} cm breed. Wat is die omtrek in cm?`,a:2*(l+b),exp:`Omtrek = 2 × (${l} + ${b}) = ${2*(l+b)} cm.`})}
  if(typ===1){const l=ri(4,12),b=ri(3,10);return Witem({typ:'type',tag:'Oppervlakte',q:`’n Reghoek is ${l} cm lank en ${b} cm breed. Wat is die oppervlakte in cm²?`,a:l*b,exp:`Oppervlakte = ${l} × ${b} = ${l*b} cm².`})}
  if(typ===2){const l=ri(2,5),b=ri(2,4),h=ri(2,4);return Witem({typ:'type',tag:'Volume',q:`’n Reghoekige prisma is ${l} cm lank, ${b} cm breed en ${h} cm hoog. Wat is die volume in cm³? (Jy mag die kubusies tel: l × b × h.)`,a:l*b*h,exp:`Volume = ${l} × ${b} × ${h} = ${l*b*h} cm³.`})}
  if(typ===3){const vals=[ri(5,12),ri(5,12),ri(8,16),ri(3,8),ri(6,14)];const names=['Appels','Piesangs','Lemoene','Druiwe','Spanspek'];
    const qtyp=rp(['max','sum','diff']);
    if(qtyp==='max'){const mx=Math.max(...vals);if(vals.filter(v=>v===mx).length!==1)return gOmtrek();const nm=names[vals.indexOf(mx)];return Witem({typ:'type',tag:'Data',q:`Gunslingste vrugte: ${names.map((n,i)=>n+' '+vals[i]).join(', ')}. Watter vrug is die meeste gekies? Skryf die naam.`,a:nm.toLowerCase(),exp:`${nm} is die meeste gekies (${mx}).`,check:'text'})}
    if(qtyp==='sum'){const s=vals.reduce((a,b)=>a+b,0);return Witem({typ:'type',tag:'Data',q:`Gunslingste vrugte: ${names.map((n,i)=>n+' '+vals[i]).join(', ')}. Hoeveel leerders het in die geheel gestem?`,a:s,exp:`Totaal = ${vals.join(' + ')} = ${s}.`})}
    const i=0,j=2;const d=Math.abs(vals[i]-vals[j]);return Witem({typ:'type',tag:'Data',q:`Gunslingste vrugte: ${names.map((n,i)=>n+' '+vals[i]).join(', ')}. Hoeveel meer leerders het ${vals[j]>=vals[i]?names[j]:names[i]} as ${vals[j]>=vals[i]?names[i]:names[j]} gekies?`,a:d,exp:`${Math.max(vals[i],vals[j])} − ${Math.min(vals[i],vals[j])} = ${d}.`})}
  const trans=[{q:'As jy ’n vorm oor ’n lyn <b>spiegel</b>, noem ons dit ’n …',a:'weerkaatsing',e:'’n Spiegeling oor ’n lyn is ’n weerkaatsing.'},{q:'As jy ’n vorm na ’n ander plek <b>skuif</b> sonder om dit te draai, noem ons dit ’n …',a:'verskuiwing',e:'’n Skuif sonder draai is ’n verskuiwing.'},{q:'As jy ’n vorm om ’n punt <b>draai</b>, noem ons dit ’n …',a:'rotasie',e:'Draai om ’n punt is ’n rotasie.'}];
  const tr=rp(trans);return Witem({typ:'choice',tag:'Transformasie',q:tr.q,opts:shuf(['weerkaatsing','verskuiwing','rotasie','vergroting']),ai:null,exp:tr.e,ansName:tr.a})}

const WGEN={heel:[gPlek,gRang,gAfrond,gTel,gVergelyk,gUitrek],sin:[gSin],optel:[gOptel],verm:[gVerm],deel:[gDeel],pat:[gPat],breuk:[gBreuk],vorm:[gVorm],meting:[gMeting],omtrek:[gOmtrek]};

function genFrom(fns,n){const items=[];const bag=fns.slice();for(let i=0;i<n;i++){let it,tries=0;do{it=bag[i%bag.length]();tries++}while(!it&&tries<8);if(it)items.push(it)}return shuf(items)}
function genLevel(l){if(l.test)return genAllTest(12);return genFrom(WGEN[l.gen],9)}
function genAllTest(n){const all=Object.values(WGEN).flat();return genFrom(all,n)}
function genByTag(t,n){if(t==='X')return genAllTest(n);const l=WLV.find(x=>x.t===t);return l?genLevel(Object.assign({},l,{test:false})):genAllTest(n)}

function showW(){S.tried=false;S.done=false;S.att=0;SEL=null;Xseq=[];

const inp=document.getElementById('wa');if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ansW()}})}}

function insSym(e,ch){if(e){e.preventDefault();e.stopPropagation()}
  const ae=document.activeElement;const inp=(ae&&(ae.id==='wa'||ae.id==='werk'))?ae:document.getElementById('wa');if(!inp||inp.disabled||S.done)return;

function renderW(it){
  if(it.typ==='type')return `<div class="winp"><div class="symbar" role="toolbar" aria-label="Wiskunde-simbole">`+[['+','+'],['−','−'],['×','×'],['÷','÷'],['/','/'],['=', '='],[',', ',']].map(p=>`<button type="button" class="sym" tabindex="-1" data-ch="${p[1]}" onpointerdown="insSym(event,'${p[1]}')">${p[0]}</button>`).join('')+`</div><input id="wa" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Jou antwoord" aria-label="Antwoord"></div><details class="werk"><summary>✏️ Werkruimte</summary><textarea id="werk" placeholder="Wys jou somme hier. Dit word nie nagesien nie." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea></details><button class="big" onclick="ansW()">Antwoord</button>`;
  if(it.typ==='choice')return it.opts.map((o,k)=>`<button class="op popin" style="--i:${k}" id="b${k}" onclick="ansW(${k})">${o}</button>`).join('');
  if(it.typ==='order')return `<p class="small">Tik in die regte volgorde. Tik weer om te verwyder.</p><div class="chips" id="wopts">${it.opts.map((o,k)=>`<span class="chip" id="wc${k}" onclick="wTap(${k})">${o}</span>`).join('')}</div>
<div class="wseq" id="wseq"></div><button class="big" onclick="ansW()">Antwoord</button>`;
  return ''}
function wTap(k){if(S.done)return;const i=Xseq.indexOf(k);if(i>=0)Xseq.splice(i,1);else Xseq.push(k);wPaint()}
function wPaint(){const it=S.items[S.i];document.querySelectorAll('#wopts .chip').forEach((e,k)=>e.style.opacity=Xseq.includes(k)?.35:1);
document.getElementById('wseq').innerHTML=Xseq.map((k,i)=>`<span class="chip done" onclick="wTap(${k})">${i+1}. ${it.opts[k]}</span>`).join(' ')}

function checkW(it,user){
  if(it.check==='time'){const u=(''+user).trim().replace('.',':').replace('h',':');const pad=s=>s.split(':').map(x=>String(+x).padStart(2,'0')).join(':');try{return pad(u)===pad(it.a)}catch(e){return false}}
  if(it.check==='text'){return (''+user).trim().toLowerCase().replace(/s$/,'')===(''+it.a).toLowerCase().replace(/s$/,'')}
  if(it.check==='expand'){const u=normExpr(''+user).replace(/\s+/g,'');if(!u.includes('+'))return false;const got=u.split('+').map(Number).sort((a,b)=>a-b);const expect=String(it.a).split('+').map(Number).sort((a,b)=>a-b);if(got.length!==expect.length||got.some(n=>!isFinite(n)||n<=0))return false;return got.every((n,i)=>n===expect[i])}
  if(it.check==='eq'){const m=(''+user).trim().match(/^(\d+)\s*\/\s*(\d+)$/);if(!m)return false;const a=+m[1],b=+m[2];return b&&a/b===it.a.eq[0]/it.a.eq[1]&&!(a===it.a.eq[0]&&b===it.a.eq[1])}
  if(it.check==='frac'){const m=(''+user).trim().replace(/,/g,'.').match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);if(m){const a=+m[1],b=+m[2];return b&&Math.abs(a/b-it.a.frac[0]/it.a.frac[1])<1e-9}return numEq(user,it.a.frac[0]/it.a.frac[1])}
  if(it.a&&it.a.two){const nums=(''+user).split(/[;,\s]+/).map(s=>parseAns(s).n).filter(n=>isFinite(n));return nums.length>=2&&nums[0]===it.a.two[0]&&nums[1]===it.a.two[1]}
  if(it.a&&it.a.three){const nums=(''+user).split(/[;,\s]+/).map(s=>parseAns(s).n).filter(n=>isFinite(n));return nums.length>=3&&nums[0]===it.a.three[0]&&nums[1]===it.a.three[1]&&nums[2]===it.a.three[2]}
  if(it.a&&it.a.q!=null&&it.a.rem!=null)return numEq(user,{rem:it.a.rem,q:it.a.q});
  return numEq(user,it.a)}

function ansW(k){
  const it=S.items[S.i],fb=document.getElementById('fb');
  let right=false,user;
  if(it.typ==='choice'){const b=document.getElementById('b'+k);if(!b||b.disabled)return;right=k===choiceIndex(it);user=it.opts[k];
    if(S.m==='o'){if(right){b.classList.add('ok')}else{b.classList.add('bad');b.disabled=true}}
  }else if(it.typ==='order'){user=Xseq.map(i=>it.opts[i]);right=user.length===it.a.length&&user.every((x,i)=>x==it.a[i])}
  else{const inp=document.getElementById('wa');if(!inp)return;user=inp.value;if(!(''+user).trim()){inp.focus();return}right=checkW(it,user)}
  finishW(right,it)}

function finishW(right,it){
  const fb=document.getElementById('fb');if(S.done)return;
  if(right){S.done=true;hit();if(S.mode==='foute')delFout(it);const g=pick(GOOD);mood('happy',g);fb.innerHTML=g+(S.st>=3?` 🔥 ${S.st} op 'n ry!`:'')+`<div class="ex">${it.exp||''}</div>`;document.querySelectorAll('.card button.op,.card button.big,.symbar button').forEach(x=>{if(x.id!=='nxb')x.disabled=true});const inp=document.getElementById('wa');if(inp)inp.disabled=true;next();return}
  S.tried=true;S.st=0;S.att=(S.att||0)+1;vib([40,40,40]);
  if(S.att>=maxTries()){S.done=true;addFout(it);revealW(it);mood('sad','Kyk mooi na die regte antwoord 💡');fb.innerHTML=`Die regte antwoord word nou gewys 💡<div class="ex">${it.exp||''}</div>`;document.querySelectorAll('.card button.op,.card button.big,.symbar button').forEach(x=>{if(x.id!=='nxb')x.disabled=true});const inp=document.getElementById('wa');if(inp)inp.disabled=true;next();return}
  paintRetry(fb);wRetryKeep(it)}


function foutCount(pfx){const a=ld(pfx+'Foute',[]);return Array.isArray(a)?a.length:0}
function foutWord(n){return n===1?'1 fout':n+' foute'}
function starPack(pfx,levels){const st=ld(pfx+'Stars',{})||{};const rows=levels.map((l,i)=>({n:l.n,ic:l.ic,s:Math.max(0,Math.min(3,+st[i]||0))}));return {rows,sum:rows.reduce((a,r)=>a+r.s,0),max:levels.length*3}}
function ster(n){return [1,2,3].map(k=>k<=n?'⭐':'☆').join('')}

  return ['Graad 5 Quiz — vorderingskaart',nm,'',...blok('Natuurwetenskap',nw,nb,foutCount('nw')),'',...blok('Wiskunde',wk,wb,foutCount('wk')),'','Sterre en tellings bly op hierdie toestel.'].join('\n')}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
function deelKaart(){const t=kaartText(),el=document.getElementById('deelst');const done=m=>{if(el)el.textContent=m};

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(go).catch(()=>{fallbackCopy(t);go()});return}

function kaart(back){stopCf();const nw=starPack('nw',LV),wk=starPack('wk',WLV),nb=ld('nwBest',{})||{},wb=ld('wkBest',{})||{};

function repairUnlocks(){
  [{'pfx':'nw','levels':LV},{'pfx':'wk','levels':(typeof WLV!=='undefined'?WLV:[])}].forEach(({pfx,levels})=>{
    const st=ld(pfx+'Stars',{})||{};
    const out={};
    Object.keys(st).forEach(k=>{const i=+k,v=+st[k];if(isFinite(i)&&i>=0&&v>=1)out[i]=Math.max(+out[i]||0,v)});
    const done=Object.keys(out).map(Number).filter(i=>(+out[i]||0)>=1);
    if(!done.length)return;
    const max=Math.max(...done);
    let changed=false;
    for(let i=0;i<max && i<levels.length;i++){if((+out[i]||0)<1){out[i]=1;changed=true}}
    const same=Object.keys(st).length===Object.keys(out).length&&Object.keys(out).every(k=>+st[k]===+out[k]);
    if(changed||!same)sv(pfx+'Stars',out);
  });
}
